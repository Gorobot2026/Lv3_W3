<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iDekTep BINGO – สุ่มอุปกรณ์</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9ff;--bg2:#d8ecff;--panel:#fff;--ink:#231a4a;--purple:#6a2bd9;--soft:#f5f1ff;--line:#c9b8f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1546;--bg2:#10224f;--panel:#fff;--ink:#fff;--soft:#2a2166;--line:#6a58b8}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Kanit',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;overflow-x:hidden}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 24px;text-align:center}
.head{width:100%;display:block;border-radius:0 0 28px 28px;box-shadow:0 8px 24px #0003}
.stage{position:relative;margin:18px auto 0;width:min(92vw,400px);border-radius:30px;padding:6px;background:conic-gradient(from var(--a,0deg),#ff4fa3,#ffd23f,#36e3ff,#8a5cff,#ff4fa3);animation:spin 4s linear infinite}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.inner{border-radius:25px;background:var(--panel);color:#231a4a;padding:16px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pic{width:100%;height:min(46vw,200px);object-fit:contain}
.pill{font-weight:800;font-size:clamp(24px,7vw,36px);padding:4px 26px;border-radius:999px;background:#eee;transition:background .2s}
.th{font-size:clamp(15px,4vw,19px);opacity:.75;min-height:1.4em}
.q{font-size:110px;line-height:1.3}
.inner.rolling .pic{animation:shake .12s infinite}
.inner.pop .pic{animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
.inner.pop .pill{animation:pop .8s .1s cubic-bezier(.2,1.6,.4,1) both}
@keyframes shake{0%{transform:rotate(-5deg) scale(1.05)}50%{transform:rotate(5deg) scale(.95)}100%{transform:rotate(-5deg) scale(1.05)}}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
.btn{font:inherit;font-weight:800;border:0;cursor:pointer;color:#2b1065;background:linear-gradient(180deg,#ffe36e,#ffb300);border-radius:999px;padding:14px 38px;font-size:clamp(22px,6vw,30px);box-shadow:0 7px 0 #b36b00,0 14px 24px #0004;transition:transform .1s,box-shadow .1s;margin:20px 6px 8px}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b36b00}
.btn:disabled{filter:grayscale(.7);opacity:.7;cursor:wait}
.btn.sm{font-size:15px;padding:7px 18px;box-shadow:0 3px 0 #0003;background:var(--soft);color:var(--ink);border:1px solid var(--line);margin:0}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
label{background:var(--soft);border:1px solid var(--line);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:15px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:20px;padding:12px;border:4px solid var(--purple);border-radius:24px;background:var(--panel)}
.tile{position:relative;padding:8px 6px 10px;border-radius:16px;background:#fff;border:2px solid #eee;color:#231a4a;transition:all .3s}
.tile img{width:100%;height:84px;object-fit:contain;filter:grayscale(1) opacity(.35);transition:filter .3s}
.tile .l{display:inline-block;margin-top:4px;padding:2px 12px;border-radius:999px;background:#eee;font-weight:800;font-size:15px}
.tile.on{border-color:var(--purple);transform:scale(1.03);box-shadow:0 6px 14px #6a2bd944}
.tile.on img{filter:none}
.tile.on .l{background:var(--c)}
.tile.new{animation:glow 1s 3}
.tile .n{position:absolute;top:-9px;right:-7px;background:#ff4fa3;color:#fff;font-weight:800;border-radius:50%;width:28px;height:28px;display:none;align-items:center;justify-content:center;box-shadow:0 3px 0 #0003}
.tile.on .n{display:flex}
@keyframes glow{50%{box-shadow:0 0 26px 8px #ffd23f}}
.done{display:none;font-size:clamp(22px,6vw,34px);font-weight:800;color:#e0289a;margin-top:14px}
.hint{opacity:.7;font-size:14px;margin-top:14px}
</style>
</head>

const $=id=>document.getElementById(id);
let drawn=[],busy=false;
$('board').innerHTML=I.map((x,i)=>`<div class="tile" id="t${i}" style="--c:${x.c}"><span class="n"></span><img src="${x.i}" alt=""><span class="l">${x.n}</span></div>`).join('');
let ac;
function tone(f,d=.08,type='square',v=.05,when=0){
  if(!$('snd').checked)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.value=v;o.connect(g);g.connect(ac.destination);
  const s=ac.currentTime+when;o.start(s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.stop(s+d);}catch(e){}
}
function fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.12,i*.11))}
function show(i){const x=I[i];$('q').hidden=true;$('pic').hidden=false;$('pic').src=x.i;$('nm').textContent=x.n;$('nm').style.background=x.c;$('th').textContent=x.t}
function draw(){
  if(busy)return;
  const nodup=$('nodup').checked;
  const pool=I.map((_,i)=>i).filter(i=>!nodup||!drawn.includes(i));
  if(!pool.length){$('done').style.display='block';burst(160);return}
  busy=true;$('go').disabled=true;$('done').style.display='none';
  const win=pool[Math.random()*pool.length|0];
  const inner=$('inner');inner.classList.remove('pop');inner.classList.add('rolling');
  const steps=24+(Math.random()*8|0);let k=0;
  (function tick(){
    if(k>=steps){finish(win);return}
    show(Math.random()*I.length|0);tone(280+k*22,.06);
    k++;setTimeout(tick,55+k*k*.3);
  })();
}
function finish(w){
  const inner=$('inner');inner.classList.remove('rolling');
  show(w);void inner.offsetWidth;inner.classList.add('pop');
  if(!drawn.includes(w))drawn.push(w);
  const t=$('t'+w);t.classList.add('on','new');t.querySelector('.n').textContent=drawn.indexOf(w)+1;
  setTimeout(()=>t.classList.remove('new'),3200);
  fanfare();burst(90);
  busy=false;$('go').disabled=false;
  if($('nodup').checked&&drawn.length===I.length){setTimeout(()=>{$('done').style.display='block';burst(200);fanfare()},900)}
}
function reset(){
  if(busy)return;drawn=[];
  document.querySelectorAll('.tile').forEach(t=>t.classList.remove('on','new'));
  $('q').hidden=false;$('pic').hidden=true;$('nm').textContent='พร้อมหรือยัง?';$('nm').style.background='#eee';$('th').textContent='กดปุ่มสุ่มเลย';
  $('inner').classList.remove('pop');$('done').style.display='none';
}
$('go').onclick=draw;$('rs').onclick=reset;
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();draw()}});
const cv=$('fx'),cx=cv.getContext('2d');let P=[],run=false;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',size);size();
function burst(n){
  const cols=['#ffd23f','#ff4fa3','#36e3ff','#3ddc97','#6a2bd9','#ff7a1a'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=6+Math.random()*12;
    P.push({x:cv.width/2,y:cv.height*.45,vx:Math.cos(a)*s*devicePixelRatio,vy:(Math.sin(a)*s-6)*devicePixelRatio,w:(6+Math.random()*8)*devicePixelRatio,r:Math.random()*6,vr:Math.random()*.4-.2,c:cols[i%cols.length],l:90+Math.random()*50})}
  if(!run){run=true;requestAnimationFrame(loop)}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  P=P.filter(p=>p.l>0);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.35*devicePixelRatio;p.vx*=.99;p.r+=p.vr;p.l--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);cx.restore()}
  if(P.length)requestAnimationFrame(loop);else run=false;
}
</script>
